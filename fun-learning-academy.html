<html lang="en">
<head>

<style>
  :root {
    --font-heading: 'Fredoka', cursive, sans-serif;
    --font-body: 'Nunito', sans-serif;
  }
  
  body {
    font-family: var(--font-body);
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 40%, #0369a1 100%);
    background-attachment: fixed;
    color: #2d3748;
    overflow-x: hidden;
  }

  h1, h2, h3, .font-heading {
    font-family: var(--font-heading);
  }

  /* Keyframe Animations */
  @keyframes floatSlow {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(2deg); }
  }

  @keyframes floatBalloon {
    0%, 100% { transform: translateY(0px) rotate(-4deg); }
    50% { transform: translateY(-16px) rotate(4deg); }
  }

  @keyframes floatCloud {
    0% { transform: translateX(-10%); }
    50% { transform: translateX(10%); }
    100% { transform: translateX(-10%); }
  }

  @keyframes flyPlane {
    0%, 100% { transform: translateY(0px) rotate(-3deg); }
    50% { transform: translateY(-14px) rotate(3deg); }
  }

  @keyframes flyRocket {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(6px, -12px) rotate(4deg); }
  }

  @keyframes pulsePlay {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
    50% { transform: scale(1.08); box-shadow: 0 0 0 24px rgba(251, 191, 36, 0); }
  }

  @keyframes waveArm {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-25deg); }
  }

  @keyframes propSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes ballSpin {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.05); }
    100% { transform: rotate(360deg) scale(1); }
  }

  @keyframes bounceCute {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px) scale(1.03); }
  }

  @keyframes earWiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-5deg); }
    75% { transform: rotate(5deg); }
  }

  @keyframes wobbleWrong {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px) rotate(-3deg); }
    40%, 80% { transform: translateX(8px) rotate(3deg); }
  }

  @keyframes popSuccess {
    0% { transform: scale(0.9); opacity: 0.8; }
    50% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .anim-float { animation: floatSlow 4s ease-in-out infinite; }
  .anim-plane { animation: flyPlane 3.5s ease-in-out infinite; }
  .anim-rocket { animation: flyRocket 4s ease-in-out infinite; }
  .anim-pulse-play { animation: pulsePlay 2s infinite; }
  .anim-wave { transform-origin: 70% 70%; animation: waveArm 1.5s ease-in-out infinite; }
  .anim-prop { transform-origin: center; animation: propSpin 0.3s linear infinite; }
  .anim-ball { animation: ballSpin 6s linear infinite; }
  .anim-cloud-left { animation: floatCloud 12s ease-in-out infinite; }
  .anim-cloud-right { animation: floatCloud 15s ease-in-out infinite reverse; }
  .anim-balloon-1 { animation: floatBalloon 5s ease-in-out infinite; }
  .anim-balloon-2 { animation: floatBalloon 6.5s ease-in-out infinite reverse; }
  .anim-bounce { animation: bounceCute 2.5s ease-in-out infinite; }
  .anim-wiggle { animation: earWiggle 3s ease-in-out infinite; }
  .anim-wobble { animation: wobbleWrong 0.5s ease-in-out; }
  .anim-pop { animation: popSuccess 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

  /* Title text stroke & 3D shadow matching the image */
  .title-3d {
    font-family: var(--font-heading);
    color: #FBBF24;
    text-shadow: 
      0 4px 0 #D97706,
      0 8px 0 #92400E,
      0 12px 18px rgba(0,0,0,0.35),
      -2px -2px 0 #FFF,
      2px -2px 0 #FFF,
      -2px 2px 0 #FFF,
      2px 2px 0 #FFF;
    letter-spacing: 2px;
  }

  .title-3d-sub {
    font-family: var(--font-heading);
    color: #EC4899;
    text-shadow: 
      0 4px 0 #BE185D,
      0 8px 0 #831843,
      0 12px 18px rgba(0,0,0,0.35),
      -2px -2px 0 #FFF,
      2px -2px 0 #FFF,
      -2px 2px 0 #FFF,
      2px 2px 0 #FFF;
    letter-spacing: 2px;
  }

  /* Cloud & Card Styling */
  .cloud-card {
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(8px);
    border: 4px solid #ffffff;
    box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0,0,0,0.05);
  }

  /* 3D Game Card Box (Matching Image Vibe) */
  .game-card-box {
    background: #ffffff;
    border-radius: 1.5rem;
    padding: 6px;
    box-shadow: 0 10px 0px rgba(0, 0, 0, 0.18), 0 6px 16px rgba(0, 0, 0, 0.15);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    cursor: pointer;
  }

  .game-card-box:hover {
    transform: translateY(-8px) scale(1.04);
    box-shadow: 0 16px 0px rgba(0, 0, 0, 0.16), 0 12px 24px rgba(0, 0, 0, 0.25);
  }

  .game-card-box:active {
    transform: translateY(2px) scale(0.98);
    box-shadow: 0 4px 0px rgba(0, 0, 0, 0.2);
  }

  .btn-bubble {

    box-shadow: 0 6px 0px rgba(0,0,0,0.12);
  }

    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 99;

<script>
/* ==========================================================================
   TRIAL DATABASE (IndexedDB, with localStorage fallback)
   --------------------------------------------------------------------------
   Every finished quiz is stored as one "trial" record, so progress can be
   tracked across many attempts instead of only the latest result.

   Store: "trials"  (keyPath: id, autoIncrement)
   Record shape:
     { id, player, subjectId, subjectName, attempt,   // attempt = Nth try of this
       correct, total, percent, perfect, stars,       //   subject by this player
       timestamp, answers: [{ q, chosen, right, ok }] }
   Indexes: player, subjectId, player_subject [player, subjectId], timestamp
   ========================================================================== */
const DB_NAME = 'fla-db';
const DB_VERSION = 1;
const TRIAL_STORE = 'trials';
const LS_TRIALS_KEY = 'fla-trials';
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('IndexedDB not supported')); return; }
    let req;
    try { req = indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { reject(e); return; }
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(TRIAL_STORE)) {
        const st = db.createObjectStore(TRIAL_STORE, { keyPath: 'id', autoIncrement: true });
        st.createIndex('player', 'player');
        st.createIndex('subjectId', 'subjectId');
        st.createIndex('player_subject', ['player', 'subjectId']);
        st.createIndex('timestamp', 'timestamp');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('IndexedDB blocked'));
  });
  return dbPromise;
}

/* localStorage fallback (used only if IndexedDB is unavailable, e.g. some private modes) */
function lsReadTrials() {
  try { return JSON.parse(localStorage.getItem(LS_TRIALS_KEY) || '[]'); } catch (e) { return []; }
}
function lsWriteTrials(arr) {
  try { localStorage.setItem(LS_TRIALS_KEY, JSON.stringify(arr)); } catch (e) {}
}

async function dbAddTrial(trial) {
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(TRIAL_STORE, 'readwrite');
      const st = tx.objectStore(TRIAL_STORE);
      const countReq = st.index('player_subject').count(IDBKeyRange.only([trial.player, trial.subjectId]));
      countReq.onsuccess = () => {
        trial.attempt = countReq.result + 1;
        st.add(trial);
      };
      tx.oncomplete = () => resolve(trial);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  } catch (e) {
    const arr = lsReadTrials();
    trial.attempt = arr.filter(t => t.player === trial.player && t.subjectId === trial.subjectId).length + 1;
    trial.id = Date.now() + Math.random();
    arr.push(trial);
    lsWriteTrials(arr);
    return trial;
  }
}

async function dbGetAllTrials() {
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const req = db.transaction(TRIAL_STORE, 'readonly').objectStore(TRIAL_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    return lsReadTrials();
  }
}

/* Delete one player's trials, or everything when player is null */
async function dbDeleteTrials(player) {
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(TRIAL_STORE, 'readwrite');
      const st = tx.objectStore(TRIAL_STORE);
      if (player === null) {
        st.clear();
      } else {
        const cur = st.index('player').openCursor(IDBKeyRange.only(player));
        cur.onsuccess = () => {
          const c = cur.result;
          if (c) { c.delete(); c.continue(); }
        };
      }
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) {
    const arr = lsReadTrials();
    lsWriteTrials(player === null ? [] : arr.filter(t => t.player !== player));
  }
}

}

function speak(text) {
  if (isVoiceMuted || !('speechSynthesis' in window)) return;

  initAudio();
  window.speechSynthesis.cancel();

  setTimeout(() => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.volume = 1.0;
    utterance.pitch = 1.4; // Soft, upbeat, friendly child pitch
    utterance.rate = 0.85; // Clear, easy-to-understand speaking pace

    const voices = window.speechSynthesis.getVoices();
    if (voices && voices.length > 0) {
      const childVoice = voices.find(v => 
        v.lang.startsWith('en') && 
        (v.name.includes('Samantha') || v.name.includes('Victoria') || v.name.includes('Google US English') || v.name.includes('Karen') || v.name.includes('Female'))

      if (childVoice) {
        utterance.voice = childVoice;
      }
    }

    window.speechSynthesis.speak(utterance);
  }, 60);
}

/* Gentle Melodic Background Music Chimes */
const bgmNotes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 440.00, 349.23, 392.00, 523.25, 659.25, 523.25];
function startBGM() {
  if (bgmInterval || isAudioMuted) return;
  bgmInterval = setInterval(() => {
    if (isAudioMuted || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = bgmNotes[bgmStep % bgmNotes.length];
      gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0005, audioCtx.currentTime + 0.7);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.75);
      bgmStep++;
    } catch(e){}
  }, 800);
}

function stopBGM() {
  if (bgmInterval) {
    clearInterval(bgmInterval);
    bgmInterval = null;
  }
}

const confettiCanvas = document.getElementById('confetti-canvas');
const ctx = confettiCanvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function launchConfetti() {
  particles = [];
  const colors = ['#f472b6', '#38bdf8', '#fbbf24', '#34d399', '#a78bfa', '#fb7185'];
  for (let i = 0; i < 90; i++) {
    particles.push({
      x: window.innerWidth / 2,
      y: window.innerHeight / 2 - 50,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.7) * 14,
      size: Math.random() * 9 + 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      rSpeed: (Math.random() - 0.5) * 10
    });
  }
  requestAnimationFrame(updateConfetti);
}

function updateConfetti() {
  ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  let alive = false;
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.35;
    p.rotation += p.rSpeed;
    if (p.y < confettiCanvas.height) alive = true;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate((p.rotation * Math.PI) / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    ctx.restore();
  });
  if (alive) requestAnimationFrame(updateConfetti);
}

function shuffle(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function showModal(title, msg, icon = '🎉', confirmCb = null, confirmLabel = 'Yes, Redeem!') {
  const modal = document.getElementById('custom-modal');
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-msg').textContent = msg;
  document.getElementById('modal-icon').textContent = icon;
  const actions = document.getElementById('modal-actions');
  actions.innerHTML = '';

  if (confirmCb) {
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-bubble bg-gray-200 text-gray-800 font-extrabold px-5 py-2.5 rounded-2xl';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.onclick = () => { playClickSound(); modal.classList.add('hidden'); };

    const okBtn = document.createElement('button');
    okBtn.className = 'btn-bubble bg-purple-600 text-white font-extrabold px-6 py-2.5 rounded-2xl';
    okBtn.textContent = confirmLabel;
    okBtn.onclick = () => { playClickSound(); modal.classList.add('hidden'); confirmCb(); };

    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
  } else {
    const okBtn = document.createElement('button');
    okBtn.className = 'btn-bubble bg-purple-600 text-white font-extrabold px-6 py-2.5 rounded-2xl';
    okBtn.textContent = 'Awesome!';
    okBtn.onclick = () => { playClickSound(); modal.classList.add('hidden'); };
    actions.appendChild(okBtn);
  }
  modal.classList.remove('hidden');
}

function choose(answer) {
  if (answered) return;
  answered = true;
  stopSpeech();
  let q = activeSubject.questions[qIndex];
  let ok = answer === q[1];
  const fb = document.getElementById('feedback');

  // Record this answer for the trial being played
  trialAnswers.push({ q: q[0], chosen: answer, right: q[1], ok });

  document.querySelectorAll('.answer-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent.trim() === q[1]) {
      b.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'anim-pop');
    }
  });

  if (ok) {
    correct++;
    data.points += 5;
    playCorrectSound();
    playCoinsSound();
    fb.className = 'min-h-[50px] flex items-center justify-center font-black text-lg text-center rounded-2xl px-4 py-2 bg-emerald-100 text-emerald-900 border-2 border-emerald-300 anim-pop';
    fb.innerHTML = '🎉 Great job! You earned +5 stars! ⭐';
    
    const happyPhrases = [
      "Yay! Super job!",
      "Woohoo! You got it right!",
      "Awesome answer!",
      "Great job! You earned five stars!"
    ];
    speak(happyPhrases[Math.floor(Math.random() * happyPhrases.length)]);
  } else {
    playWrongSound();
    fb.className = 'min-h-[50px] flex items-center justify-center font-black text-lg text-center rounded-2xl px-4 py-2 bg-amber-100 text-amber-900 border-2 border-amber-300 anim-wobble';
    fb.innerHTML = `💛 Good try! The correct answer is <strong>${q[1]}</strong>.`;
    speak("Good try! The correct answer is " + q[1] + ". You can do it!");
  }

  document.getElementById('next').style.display = 'inline-block';
  save();
}

function nextQuestion() {
  playClickSound();
  stopSpeech();
  qIndex++;
  answered = false;
  render();
}

function finishHTML(s) {
  let perfect = correct === s.questions.length;
  let bonus = perfect ? 20 : 0;
  
  if (!window.finishHandled) {
    if (perfect) {
      if (!data.completed.includes(s.id)) data.completed.push(s.id);
      if (data.unfinished) data.unfinished = data.unfinished.filter(id => id !== s.id);
      data.points += 10 + bonus;
    } else {
      if (!data.unfinished) data.unfinished = [];
      if (!data.unfinished.includes(s.id)) data.unfinished.push(s.id);
      data.completed = data.completed.filter(id => id !== s.id);
    }
    
    window.finishHandled = true;
    save();

    // Save this trial to the database
    const total = s.questions.length;
    dbAddTrial({
      player: data.playerName || 'Super Learner',
      subjectId: s.id,
      subjectName: s.name,
      correct,
      total,
      percent: Math.round((correct / total) * 100),
      perfect,
      stars: correct * 5 + (perfect ? 10 + bonus : 0),
      timestamp: Date.now(),
      answers: trialAnswers.slice()
    }).then(t => {
      const el = document.getElementById('trial-note');
      if (el) el.textContent = `📝 Trial #${t.attempt} saved to your progress record`;
    }).catch(() => {});

    launchConfetti();
    playFanfareSound();
    
    if (perfect) {
      speak("Awesome! Perfect score! You finished " + s.name + " and earned bonus stars!");
    } else {
      speak("Good effort! You got " + correct + " out of " + s.questions.length + " right. Try again to mark it finished!");
    }
  }

  return `
    <div class="text-center py-6 space-y-6 anim-pop">
      <div class="w-32 h-32 mx-auto bg-amber-100 rounded-full p-2 border-4 border-amber-300">
        ${Mascots.Owl}

        ${perfect ? `🎉 Perfect Score! Subject Finished! (+${10 + bonus} stars)` : `⚠️ You got some questions wrong! Replay and get 100% to finish this lesson.`}

/* Fill the Trial History section from the database */
async function loadTrialHistory() {
  const box = document.getElementById('trial-history');
  const sel = document.getElementById('history-player');
  if (!box || !sel) return;

  const all = await dbGetAllTrials();

  // Player dropdown: everyone with trials, plus the current player
  const prev = sel.value || data.playerName || 'Super Learner';
  const players = Array.from(new Set([data.playerName || 'Super Learner', ...all.map(t => t.player)]));
  sel.innerHTML = players.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
  sel.value = players.includes(prev) ? prev : players[0];
  const player = sel.value;

  const mine = all.filter(t => t.player === player).sort((a, b) => a.timestamp - b.timestamp);
  if (!mine.length) {
    box.innerHTML = `<p class="text-purple-500 font-bold">No trials recorded for <span class="font-black">${esc(player)}</span> yet. Finish a quiz to start the record!</p>`;
    return;
  }

  const perfectCount = mine.filter(t => t.perfect).length;
  const overallAvg = Math.round(mine.reduce((n, t) => n + t.percent, 0) / mine.length);

  const perSubject = subjects.map(s => {
    const trials = mine.filter(t => t.subjectId === s.id);
    if (!trials.length) return '';
    const best = Math.max(...trials.map(t => t.percent));
    const last = trials[trials.length - 1].percent;
    const first = trials[0].percent;
    const avg = Math.round(trials.reduce((n, t) => n + t.percent, 0) / trials.length);
    const delta = last - first;
    const trend = trials.length < 2 ? '' :
      delta > 0 ? `<span class="text-emerald-600">▲ +${delta}% since first try</span>` :
      delta < 0 ? `<span class="text-rose-500">▼ ${delta}% since first try</span>` :
      `<span class="text-purple-400">● same as first try</span>`;
    const bars = trials.slice(-10).map(t => `
      <div title="Trial #${t.attempt}: ${t.correct}/${t.total}" class="w-3 rounded-t-sm ${t.perfect ? 'bg-emerald-400' : 'bg-amber-400'}" style="height:${Math.max(4, Math.round(t.percent * 0.36))}px"></div>
    `).join('');
    return `
      <div class="bg-purple-50 border-2 border-purple-200 rounded-2xl p-4 flex flex-wrap items-end justify-between gap-3">
        <div class="space-y-0.5">
          <div class="font-black text-purple-950 text-base">${s.emoji} ${s.name}</div>
          <div class="text-xs font-bold text-purple-700">${trials.length} trial${trials.length > 1 ? 's' : ''} · best ${best}% · avg ${avg}% · latest ${last}%</div>
          <div class="text-xs font-black">${trend}</div>
        </div>
        <div class="flex items-end gap-1 h-9" aria-label="Last scores">${bars}</div>
      </div>
    `;
  }).join('');

  const recent = mine.slice(-10).reverse().map(t => `
    <tr class="border-t border-purple-100">
      <td class="py-1.5 pr-3 whitespace-nowrap">${new Date(t.timestamp).toLocaleString()}</td>
      <td class="py-1.5 pr-3 font-black text-purple-950">${esc(t.subjectName)}</td>
      <td class="py-1.5 pr-3 text-center">#${t.attempt}</td>
      <td class="py-1.5 pr-3 text-center font-black ${t.perfect ? 'text-emerald-600' : 'text-amber-600'}">${t.correct}/${t.total} (${t.percent}%)</td>
      <td class="py-1.5 text-right">⭐ ${t.stars}</td>
    </tr>
  `).join('');

  box.innerHTML = `
    <div class="grid grid-cols-3 gap-3 text-center">
      <div class="bg-purple-50 border-2 border-purple-200 rounded-2xl p-3"><div class="text-xs font-bold text-purple-600 uppercase">Trials</div><div class="text-2xl font-black text-purple-900">${mine.length}</div></div>
      <div class="bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-3"><div class="text-xs font-bold text-emerald-700 uppercase">Perfect</div><div class="text-2xl font-black text-emerald-800">${perfectCount}</div></div>

/* Export every recorded trial (all players) as a CSV file */
async function exportTrialsCSV() {
  playClickSound();
  const all = await dbGetAllTrials();
  if (!all.length) {
    showModal('Nothing to export', 'Finish a quiz first and your trials will be saved here.', '📝');
    return;
  }
  const cell = v => '"' + String(v).replace(/"/g, '""') + '"';
  const header = ['Player', 'Subject', 'Attempt', 'Correct', 'Total', 'Percent', 'Perfect', 'Stars', 'Date'];
  const rows = all.sort((a, b) => a.timestamp - b.timestamp).map(t => [
    t.player, t.subjectName, t.attempt, t.correct, t.total, t.percent, t.perfect ? 'yes' : 'no', t.stars, new Date(t.timestamp).toISOString()
  ].map(cell).join(','));
  const blob = new Blob([[header.map(cell).join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'fun-learning-trials.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
window.exportTrialsCSV = exportTrialsCSV;

function redeem(id) {
  let p = prizes.find(x => x.id === id);
  if (data.points < p.cost) {
    playWrongSound();
    showModal('Need More Stars!', 'Complete more activities and quizzes to earn enough stars for this prize!', '⭐');
    return;
  }

  showModal(
    'Redeem Prize?',
    `Would you like to spend ${p.cost} stars to unlock the ${p.name}?`,
    p.emoji,
    () => {
      data.points -= p.cost;
      data.redeemed.push({
        id: p.id,
        name: p.name,
        emoji: p.emoji,
        cost: p.cost,
        date: new Date().toLocaleDateString()
      });
      save();
      launchConfetti();
      playCoinsSound();
      playFanfareSound();
      render();
      showModal('Reward Redeemed! 🎉', `You unlocked the ${p.name}! Check it out in your Rewards Shelf.`, p.emoji);

  );

// Initial Page Render
window.onload = function() {
  const fence = document.getElementById('pencil-fence');
  if (fence) {
    const fenceColors = ['#EF4444', '#F97316', '#F59E0B', '#10B981', '#06B6D4', '#3B82F6', '#8B5CF6', '#EC4899'];
    let fenceHTML = '';
    for (let i = 0; i < 28; i++) {
      const c = fenceColors[i % fenceColors.length];
      fenceHTML += `
        <div class="flex-1 h-full mx-0.5 rounded-t-sm flex flex-col justify-between" style="background:${c}">
          <div class="w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-b-[10px] border-b-amber-200 mx-auto -mt-2"></div>
        </div>
      `;
    }
    fence.innerHTML = fenceHTML;
  }

  // Open the database early so the first save is instant
  openDB().catch(() => {});

  render();

  const unlockAudio = () => {
    initAudio();
    if ('speechSynthesis' in window && window.speechSynthesis.getVoices().length === 0) {
      window.speechSynthesis.getVoices();
    }
  };
  document.body.addEventListener('click', unlockAudio, { once: true });
  document.body.addEventListener('touchstart', unlockAudio, { once: true });

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.getVoices();
    };
  }
};
